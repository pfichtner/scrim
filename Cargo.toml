[package]
name = "scrim"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "=1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }
globset = "0.4.9"
fuser = "=0.18"
libc = "0.2"

[dev-dependencies]
tempfile = "3.9"
